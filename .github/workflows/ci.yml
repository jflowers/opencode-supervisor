name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      # Keep tests from reading a global supervisor config.
      XDG_CONFIG_HOME: ${{ github.workspace }}/.ci-xdg
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: "24.x"
      - run: bun install --frozen-lockfile
      - name: Typecheck
        run: bun run typecheck
      - name: Test (Bun)
        run: bun test
      - name: Test (Node)
        run: npm run test:node
      - name: Verify package contents
        run: npm run verify:package
