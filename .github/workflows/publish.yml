name: Publish

# Publishes to npm, run from main with the version tag:
#   gh workflow run publish.yml -f tag=v2.15.0
# The pipeline is jflowers/ship's shared npm-release.yml: org-infra's
# preflight (semver, tag uniqueness, CI on HEAD, unreleased commits) creates
# the tag, then the tag is checked out, package.json's version must equal
# it, the checks below run, and the package is published with provenance.
#
# Auth: npm trusted publishing (OIDC), no token. npm checks the calling
# workflow, so npmjs.com trusts this repository and this file (publish.yml),
# not ship's. Renaming this file breaks publishing until the trusted
# publisher on npmjs.com is updated to match.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag; package.json's version must match (e.g. v2.15.0)
        required: true
        type: string

permissions: {}

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  release:
    name: Release
    uses: jflowers/ship/.github/workflows/npm-release.yml@bf09d24bd206ce8f9f1f44ea1479afa5ca11532d # v0.3.0
    with:
      tag: ${{ inputs.tag }}
      ci_checks: '["check"]'
      node_version: "24"
      bun_version: latest
      install: bun install --frozen-lockfile
      checks: |
        # Keep tests from reading a global supervisor config.
        export XDG_CONFIG_HOME="$PWD/.ci-xdg"
        bun run typecheck
        bun test
        npm run test:node
        npm run verify:package
    permissions:
      contents: write
      checks: read
      id-token: write
