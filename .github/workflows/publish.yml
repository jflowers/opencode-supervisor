name: Publish

# Publishes to npm when a version tag is pushed
# (git tag v2.9.1 && git push origin v2.9.1). The tag must match
# package.json's version; a version already on npm is skipped.
#
# Auth: npm trusted publishing (OIDC). npmjs.com trusts this repository and
# this workflow file for the package, so no npm token is used; id-token: write
# below lets the job request the OIDC token. Renaming this file breaks
# publishing until the trusted publisher on npmjs.com is updated to match.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  npm:
    name: Publish to npm
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # Keep tests from reading a global supervisor config.
      XDG_CONFIG_HOME: ${{ github.workspace }}/.ci-xdg
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: "24.x"
          registry-url: https://registry.npmjs.org

      - name: Check version
        id: package
        run: |
          NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [ "${GITHUB_REF_NAME}" != "v${VERSION}" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match package.json version ${VERSION}"
            exit 1
          fi
          if npm view "${NAME}@${VERSION}" version >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "${NAME}@${VERSION} is already on npm; nothing to do."
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.package.outputs.published == 'false'
        run: bun install --frozen-lockfile
      - name: Typecheck
        if: steps.package.outputs.published == 'false'
        run: bun run typecheck
      - name: Test (Bun)
        if: steps.package.outputs.published == 'false'
        run: bun test
      - name: Test (Node)
        if: steps.package.outputs.published == 'false'
        run: npm run test:node
      - name: Verify package
        if: steps.package.outputs.published == 'false'
        run: npm run verify:package

      - name: Publish
        if: steps.package.outputs.published == 'false'
        run: npx --yes --package npm@11 npm publish --access public --provenance --ignore-scripts
